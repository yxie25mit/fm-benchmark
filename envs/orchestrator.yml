# Minimal environment that RUNS the orchestration (run_benchmark / run_phase),
# prepares user data (prepare_user_data.py), and collects/plots results
# (collect_results.py). It does NOT train models — each method trains in its own
# env (chemprop2 / molclr / molfcl / molformer). Replaces the old heavyweight
# "foldeverything" env, which carried Boltz-specific deps not needed here.
name: orchestrator
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<2   # numpy 2.x removed ComplexWarning from numpy.core.numeric (pharma-reported ImportError)
  - pandas
  - scikit-learn
  - scipy
  - rdkit
  - matplotlib
  - pip
  - pip:
      - astartes[molecules]   # chemprop-v2 scaffold split for prepare_user_data.py --csv (v2_astartes)
